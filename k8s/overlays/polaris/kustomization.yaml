apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - configmap.yaml

patches:
  - path: patch-multus.yaml
    target:
      kind: DaemonSet
      name: defenderlink-mesh

# Node selector — only deploy on Polaris node
# Get your node name with: kubectl get nodes
patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: defenderlink-mesh
        namespace: defenderlink
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: polaris
